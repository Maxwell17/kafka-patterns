syntax = "proto3";

package com.kafka.patterns.proto;

option java_package = "com.kafka.patterns.proto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  CREATED = 1;
  CANCELLED = 2;
  COMPLETED = 3;
}

message OutboxOrderEvent {
  int64 id = 1;
  string product = 2;
  int32 quantity = 3;
  OrderStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
}