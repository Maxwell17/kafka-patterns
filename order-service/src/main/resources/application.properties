spring.application.name=order-service

server.port=8081

spring.datasource.url=jdbc:postgresql://postgres:5432/orders_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.retries=3
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=com.kafka.patterns.common.domain.entities
spring.kafka.producer.properties.spring.json.type.mapping=order:com.kafka.patterns.common.domain.entities.Order
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/demo