spring.application.name=order-service
spring.datasource.url=jdbc:postgresql://localhost:5432/orders_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=kafka:9092
# Producer: Protobuf + Schema Registry + TopicNameStrategy
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
# Schema Registry
spring.kafka.properties.schema.registry.url=http://schema-registry:8081
#spring.kafka.properties.auto.register.schemas=true
spring.kafka.properties.use.latest.version=true
spring.kafka.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.TopicNameStrategy
spring.kafka.properties.specific.protobuf.value.type=com.kafka.patterns.proto.Order
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.producer.properties.batch.size=32768
spring.kafka.producer.properties.linger.ms=20
spring.kafka.producer.properties.buffer.memory=67108864
spring.kafka.producer.properties.max.request.size=2000000
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always