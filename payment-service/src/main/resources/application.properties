# ==================================================================
# APPLICATION
# ==================================================================
spring.application.name=payment-service
server.port=8091

# ==================================================================
# DATABASE (MySQL + Hibernate + Flyway)
# ==================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/payments_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
# ==================================================================
# KAFKA (Consumer: Protobuf + Schema Registry + DLQ)
# ==================================================================
spring.kafka.bootstrap-servers=localhost:9092
# Consumer group
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
# Key and Value Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
# Schema Registry
spring.kafka.properties.schema.registry.url=http://localhost:8081
spring.kafka.properties.specific.protobuf.value.type=com.kafka.patterns.proto.OutboxOrderEvent
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
# DLQ support
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer
spring.kafka.consumer.properties.spring.deserializer.fail-on-invalid-class=false
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
spring.kafka.consumer.max-poll-records=500
spring.kafka.consumer.heartbeat-interval=3000
# Dead Letter Topic (DLQ) handling
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.default-error-handler-dlq-topic=order-events-dlq
spring.kafka.listener.default-error-handler-dlq-partitions=3
spring.kafka.listener.default-error-handler-dlq-replicas=1
# ==================================================================
# ACTUATOR
# ==================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true